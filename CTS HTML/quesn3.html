<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome Banner</title>

    <style>

        /* ID Styling */
        #welcomeBanner {
            background-color: rgb(82, 126, 82);
            color: white;
            padding: 20px;
            text-align: center;
        }

        /* Class Styling */
        .highlight {
            background-color: rgb(232, 232, 122);
            font-weight: bold;
        }

    </style>
</head>

<body>

    <!-- Welcome Banner -->
    <div id="welcomeBanner">

        <h1>Welcome Mervyn!</h1>

        <p>
            Enjoy our website and explore new features.
        </p>

        <p>
            Today's 
            <span style="color:red; font-weight:bold;">
                special Offer: 50% offer
            </span>
        </p>

    </div>

    <br>

    <!-- Highlight Class Example -->
    <p class="highlight">
        Important Announcement
    </p>

    <p>
        This is a normal para.
    </p>

    <p class="highlight">
        Limited seats available!
    </p>

</body>
</html>
