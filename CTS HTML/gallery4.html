<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Event Gallery</title>
    <style>
        .eventImage {
            width: 200px;
            height: 150px;
            border: 3px solid black;
            padding: 5px;
        }
        table {
            margin: auto;
        }
        td {
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>
    <h1 align="center">Community Events Gallery</h1>
    <table border="1">
        <tr>
            <td>
                <img src="https://via.placeholder.com/200x150"
                     alt="Music Event"
                     title="Music Festival"
                     class="eventImage">

                <p><b>Music Festival 2026</b></p>
            </td>

            <td>
                <img src="https://via.placeholder.com/200x150"
                     alt="Food Event"
                     title="Food Carnival"
                     class="eventImage">

                <p><b>Food Carnival</b></p>
            </td>

            <td>
                <img src="https://stockcake.com/i/tech-workshop-interior_1392178_435370"
                     alt="Sports Event"
                     title="Sports Meet"
                     class="eventImage">

                <p><b>Annual Sports Meet</b></p>
            </td>

        </tr>

        <tr>

            <td>
                <img src="https://stockcake.com/i/tech-workshop-interior_1392178_435370"
                     alt="Dance Event"
                     title="Dance Competition"
                     class="eventImage">

                <p><b>Dance Competition</b></p>
            </td>

            <td>
                <img src="https://stockcake.com/i/tech-workshop-interior_1392178_435370"
                     alt="Art Event"
                     title="Art Exhibition"
                     class="eventImage">

                <p><b>Art Exhibition</b></p>
            </td>

            <td>
                <img src="https://stockcake.com/i/tech-workshop-interior_1392178_435370"
                     alt="Tech Event"
                     title="Tech Workshop"
                     class="eventImage">

                <p><b>Tech Workshop</b></p>
            </td>
        </tr>
    </table>
</body>
</html>
